name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Babul-Kumar
          outputs: |
            assets/github-contribution-snake.svg?color_snake=#00d2ff&color_dots=#121820,#0d384d,#007299,#00a8e0,#00e5ff
            assets/github-contribution-snake-dark.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#0d1117,#0e3346,#005b80,#0099cc,#00e5ff

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-snake.svg assets/github-contribution-snake-dark.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update contribution snake [skip ci]" && git push origin main)
